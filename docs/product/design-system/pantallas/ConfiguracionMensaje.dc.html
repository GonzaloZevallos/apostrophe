<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mensaje del catálogo · un grupo de Configuración</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0 }
a { color: #1B4FA8 } a:hover { color: #231E18 }
</style>
</helmet>

<div style="width: 390px; height: 980px; box-sizing: border-box; background: #FCFBF8; color: #231E18; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 20px 20px 16px; display: flex; align-items: center; gap: 10px"><span style="flex: 1; font-size: 20px; font-weight: 600; letter-spacing: -0.02em">Mensaje del catálogo</span><span style="font-size: 15px; font-weight: 600; color: #706659">Cerrar</span></div>
  <div style="padding: 16px 24px 24px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto">
    <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 14px; color: #706659">Encabezado</span><textarea style="min-height: 92px; box-sizing: border-box; padding: 14px 16px; border-radius: 16px; border: 0; background: #F2EEE6; color: #231E18; font: inherit; font-size: 16px; line-height: 1.5">🌿 **CATÁLOGO** 🌿</textarea></label>
    <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 14px; color: #706659">Pie</span><textarea style="min-height: 92px; box-sizing: border-box; padding: 14px 16px; border-radius: 16px; border: 0; background: #F2EEE6; color: #231E18; font: inherit; font-size: 16px; line-height: 1.5">📩 Consultas y pedidos por privado.</textarea></label>
  <span style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 999px; background: #231E18; color: #FCFBF8; font-size: 16px; font-weight: 600">Guardá el mensaje</span>
  <span style="display: block; font-size: 13px; color: #706659; margin: 20px 24px 6px">Al guardar</span>
  <div style="background: #231E18; border-radius: 18px; padding: 15px 18px; display: flex; align-items: center; gap: 12px"><span style="flex: 1; font-size: 15px; font-weight: 500; color: #FCFBF8">Catálogo guardado</span></div>
  <span style="display: block; font-size: 13px; color: #706659; margin: 20px 24px 6px">Al cerrar con cambios sin guardar</span>
  <div style="background: #F2EEE6; border-radius: 24px; padding: 20px">
    <span style="display: block; font-size: 18px; font-weight: 600">¿Descartás el mensaje?</span>
    <span style="display: block; font-size: 15px; color: #706659; line-height: 1.5; margin-top: 6px">Se pierde lo que cargaste: todavía no se guardó nada.</span>
    <div style="display: flex; gap: 10px; margin-top: 16px">
      <span style="flex: 1; display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 999px; background: #FCFBF8; font-size: 15px; font-weight: 600">No, seguí editando</span>
      <span style="flex: 1; display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 999px; background: #33281A; color: #F7EFE0; font-size: 15px; font-weight: 600">Sí, descartalo</span>
    </div>
  </div>
  </div>
</div>

</x-dc>
</body>
</html>
