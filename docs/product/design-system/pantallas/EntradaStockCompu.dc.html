<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nueva entrada de stock en compu</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0 }
a { color: #1B4FA8 } a:hover { color: #231E18 }
</style>
</helmet>

<div style="width: 1280px; height: 920px; box-sizing: border-box; background: #FCFBF8; border: 1px solid #EBE5DA; border-radius: 12px; position: relative; display: flex; overflow: hidden; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #231E18">
  <div style="width: 256px; border-right: 1px solid #EBE5DA; opacity: 0.4; padding: 26px 16px">
    <span style="display: block; font-size: 15px; font-weight: 600">apostrophe’</span>
  </div>
  <div style="flex: 1; opacity: 0.4; padding: 28px 32px">
    <span style="font-size: 28px; font-weight: 600">Variedades</span>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(35,30,24,0.28)"></div>
  <div style="position: absolute; top: 80px; left: 50%; transform: translateX(-50%); width: 480px; background: #FCFBF8; border-radius: 24px; box-shadow: 0 24px 48px rgba(35,30,24,0.22); overflow: hidden">
    <div style="padding: 22px 24px 18px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #EBE5DA">
      <span style="flex: 1; font-size: 19px; font-weight: 600">Nueva entrada</span>
      <span style="font-size: 15px; font-weight: 600; color: #706659">Cerrar</span>
    </div>
    <div style="padding: 20px 24px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; gap: 10px">
        <label style="flex: 1; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 14px; color: #706659">Fecha</span>
          <span style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; border-radius: 16px; background: #F2EEE6; font-size: 17px; font-weight: 500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M8 3v4"/><path d="M16 3v4"/><path d="M3.5 10h17"/></svg>Hoy 05/10</span>
        </label>
        <label style="width: 120px; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 14px; color: #706659">Gramos</span>
          <input type="text" value="30" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 0; background: #F2EEE6; color: #231E18; font: inherit; font-size: 17px; font-weight: 600">
        </label>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; color: #706659">Variedad</span>
        <span style="display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 16px; border-radius: 16px; background: #F2EEE6">
          <span style="flex: 1; display: flex; flex-direction: column">
            <span style="font-size: 17px; font-weight: 600">24K Gold</span>
            <span style="font-size: 13px; color: #706659">Hoy tiene 133 g</span>
          </span>
          <span style="color: #706659"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9.5 6 6 6-6"/></svg></span>
        </span>
      </label>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 14px; color: #706659">Origen</span>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <span style="height: 44px; display: flex; align-items: center; padding: 0 18px; border-radius: 999px; background: #231E18; color: #FCFBF8; font-size: 15px; font-weight: 600">Compra</span>
          <span style="height: 44px; display: flex; align-items: center; padding: 0 18px; border-radius: 999px; background: #F2EEE6; color: #706659; font-size: 15px">Cosecha</span>
          <span style="height: 44px; display: flex; align-items: center; padding: 0 18px; border-radius: 999px; background: #F2EEE6; color: #706659; font-size: 15px">Stock inicial</span>
          <span style="height: 44px; display: flex; align-items: center; padding: 0 18px; border-radius: 999px; background: #F2EEE6; color: #706659; font-size: 15px">Ajuste</span>
        </div>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; color: #706659">Costo total</span>
        <input type="text" value="$ 150.000" style="height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 0; background: #F2EEE6; color: #231E18; font: inherit; font-size: 22px; font-weight: 600">
        <span style="font-size: 13px; color: #706659">Obligatorio cuando es una compra</span>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; color: #706659">Nota</span>
        <input type="text" value="" placeholder="Opcional" style="height: 48px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 0; background: #F2EEE6; color: #706659; font: inherit; font-size: 15px">
      </label>
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-top: 4px">
        <span style="font-size: 14px; color: #706659">Te queda en $ 5.000 el gramo</span>
        <span style="font-size: 22px; font-weight: 600; letter-spacing: -0.03em">30 g</span>
      </div>
      <span style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 999px; background: #231E18; color: #FCFBF8; font-size: 15px; font-weight: 600">Guardá la entrada</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
