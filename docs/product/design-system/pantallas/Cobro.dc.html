<div style="width: 390px; height: 800px; box-sizing: border-box; background: #FCFBF8; color: #231E18; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

    <div style="padding: 20px 24px 0; display: flex; flex-direction: column">

    </div>
