<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Crear un negocio nuevo con una invitación</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0 }
a { color: #1B4FA8 } a:hover { color: #231E18 }
</style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FCFBF8; color: #231E18; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; padding: 64px 28px 0; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 14px; color: #1B4FA8">Invitación válida</span>
      <span style="font-size: 28px; font-weight: 600; letter-spacing: -0.03em">Armá tu negocio</span>
      <span style="font-size: 16px; color: #7A7065; line-height: 1.5">Ponele un nombre y creá tu usuario. Después podés invitar a un socio.</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 14px">
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; color: #7A7065">Nombre del negocio</span>
        <input type="text" value="La Huerta" style="height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 0;  background: #F2EEE6; color: #231E18; font: inherit; font-size: 17px">
        
      </label>

      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; color: #7A7065">Email</span>
        <input type="email" value="vos@lahuerta.com" style="height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 0;  background: #F2EEE6; color: #231E18; font: inherit; font-size: 17px">
        
      </label>

      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; color: #7A7065">Contraseña</span>
        <input type="password" value="•••••••••••••" style="height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 0;  background: #F2EEE6; color: #231E18; font: inherit; font-size: 17px">
        <span style="font-size: 13px; color: #7A7065">13 caracteres · pedimos 10 como mínimo</span>
      </label>

      <div style="margin-top: 6px"><a href="Inicio.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 9px; height: 56px; border-radius: 999px; background: #231E18; color: #FCFBF8; text-decoration: none; font-size: 17px; font-weight: 600">Creá el negocio</a></div>
    </div>
  </div>
  <div style="padding: 0 28px 32px; font-size: 13px; color: #9A9085; text-align: center">La invitación se usa una sola vez y vence el 09/10.</div>

</div>
</x-dc>
</body>
</html>
