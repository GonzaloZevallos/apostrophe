<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nueva variedad y renombrar una variedad</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0 }
a { color: #1B4FA8 } a:hover { color: #231E18 }
</style>
</helmet>

<div style="width: 390px; min-height: 900px; box-sizing: border-box; background: #FCFBF8; color: #231E18; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="padding: 24px 24px 0"><span style="font-size: 26px; font-weight: 600; letter-spacing: -0.03em">VariedadNueva</span></div>
  <div style="padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 24px">

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; color: #7A7065">Frame 1 · "Nueva variedad" en Variedades</span>
      <div style="background: #FCFBF8; border: 1px solid #EBE5DA; border-radius: 28px; overflow: hidden">
        <div style="padding: 22px 24px 16px; display: flex; align-items: center; gap: 10px">
          <span style="flex: 1; font-size: 20px; font-weight: 600; letter-spacing: -0.02em">Nueva variedad</span>
          <span style="font-size: 15px; font-weight: 600; color: #7A7065">Cerrar</span>
        </div>
        <div style="padding: 0 24px; display: flex; flex-direction: column; gap: 14px">
          <label style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 14px; color: #7A7065">Nombre</span>
            <input type="text" value="" placeholder="Nombre de la variedad" style="height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 0; background: #F2EEE6; color: #9A9085; font: inherit; font-size: 17px">
            <span style="font-size: 13px; color: #7A7065">Hasta 60 caracteres · no puede repetir el nombre de otra variedad</span>
          </label>
        </div>
        <div style="padding: 18px 24px 24px"><span style="display: flex; align-items: center; justify-content: center; gap: 9px; height: 56px; border-radius: 999px; background: #231E18; color: #FCFBF8; font-size: 17px; font-weight: 600">Agregá la variedad</span></div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; color: #7A7065">Frame 2 · renombrar, desde la página de Golden Cookies</span>
      <div style="background: #FCFBF8; border: 1px solid #EBE5DA; border-radius: 28px; overflow: hidden">
        <div style="padding: 22px 24px 16px; display: flex; align-items: center; gap: 10px">
          <span style="flex: 1; font-size: 20px; font-weight: 600; letter-spacing: -0.02em">Renombrá la variedad</span>
          <span style="font-size: 15px; font-weight: 600; color: #7A7065">Cerrar</span>
        </div>
        <div style="padding: 0 24px; display: flex; flex-direction: column; gap: 14px">
          <label style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 14px; color: #7A7065">Nombre</span>
            <input type="text" value="Golden Cookies" style="height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 0; background: #F2EEE6; color: #231E18; font: inherit; font-size: 17px; font-weight: 600">
            <span style="font-size: 13px; color: #7A7065">Sus precios y entradas se mantienen</span>
          </label>
        </div>
        <div style="padding: 18px 24px 24px"><span style="display: flex; align-items: center; justify-content: center; gap: 9px; height: 56px; border-radius: 999px; background: #231E18; color: #FCFBF8; font-size: 17px; font-weight: 600">Guardá el nombre</span></div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
