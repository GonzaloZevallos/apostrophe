<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Negocio · un grupo de Configuración</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0 }
a { color: #1B4FA8 } a:hover { color: #231E18 }
</style>
</helmet>

<div style="width: 390px; height: 760px; box-sizing: border-box; background: #FCFBF8; color: #231E18; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 20px 20px 16px; display: flex; align-items: center; gap: 10px"><span style="flex: 1; font-size: 20px; font-weight: 600; letter-spacing: -0.02em">Negocio</span><span style="font-size: 15px; font-weight: 600; color: #7A7065">Cerrar</span></div>
  <div style="padding: 16px 24px 24px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto">
    <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 14px; color: #7A7065">Nombre del negocio</span><input type="text" value="La Huerta" style="height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 0; background: #F2EEE6; color: #231E18; font: inherit; font-size: 17px"></label>
  <span style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 999px; background: #231E18; color: #FCFBF8; font-size: 16px; font-weight: 600">Guardá el nombre</span>
  <span style="display: block; font-size: 13px; color: #7A7065; margin: 20px 24px 6px">Al guardar</span>
  <div style="background: #231E18; border-radius: 18px; padding: 15px 18px; display: flex; align-items: center; gap: 12px"><span style="flex: 1; font-size: 15px; font-weight: 500; color: #FCFBF8">Negocio renombrado</span></div>
  </div>
</div>

</x-dc>
</body>
</html>
