<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sumarse a un negocio por invitación</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0 }
a { color: #1B4FA8 } a:hover { color: #231E18 }
</style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FCFBF8; color: #231E18; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; padding: 64px 28px 0; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <span style="font-size: 14px; color: #1B4FA8">Te invitaron a</span>
      <div style="display: flex; align-items: center; gap: 14px">
        <span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 18px; background: #F2EEE6; font-size: 18px; font-weight: 600">LH</span>
        <span style="font-size: 32px; font-weight: 600; letter-spacing: -0.035em">La Huerta</span>
      </div>
      <span style="font-size: 16px; color: #706659; line-height: 1.5">Creá tu usuario y vas a ver las ventas, el stock y los clientes de este negocio. Sólo de este.</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 14px">
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; color: #706659">Email</span>
        <input type="email" value="" style="height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 0;  background: #F2EEE6; color: #231E18; font: inherit; font-size: 17px">
        
      </label>

      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; color: #706659">Contraseña</span>
        <input type="password" value="••••••" style="height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 0;  background: #F2EEE6; color: #231E18; font: inherit; font-size: 17px">
        <span style="font-size: 13px; color: #706659">Mínimo 10 caracteres · te faltan 4</span>
      </label>

      <div style="margin-top: 6px">
        <span style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #F2EEE6; color: #706659; font-size: 17px; font-weight: 600">Sumate a La Huerta</span>
      </div>
    </div>
  </div>
  <div style="padding: 0 28px 32px; font-size: 13px; color: #706659; text-align: center">Esta invitación vence el 09/10 y se usa una sola vez.</div>

</div>
</x-dc>
</body>
</html>
