<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Elegir cliente dentro de la venta</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0 }
a { color: #1B4FA8 } a:hover { color: #231E18 }
</style>
</helmet>

<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #FCFBF8; color: #231E18; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 92px; box-sizing: border-box; padding: 26px 24px; display: flex; align-items: center; opacity: 0.35">
    <span style="font-size: 20px; font-weight: 600">Nueva venta</span>
  </div>
  <div style="flex: 1; background: #FCFBF8; border-radius: 28px 28px 0 0; box-shadow: 0 -1px 0 #EBE5DA; display: flex; flex-direction: column; overflow: hidden">
    <div style="padding: 10px 24px 0; display: flex; flex-direction: column; gap: 14px">
      <span style="width: 40px; height: 4px; border-radius: 999px; background: #EBE5DA; align-self: center"></span>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <span style="font-size: 20px; font-weight: 600; letter-spacing: -0.02em">Elegí el cliente</span>
        <span style="font-size: 15px; font-weight: 600; color: #706659">Cerrar</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 16px; border-radius: 999px; background: #F2EEE6">
        <span style="color: #706659"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></span>
        <label for="b" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Buscar por teléfono o nombre</label>
        <input id="b" type="text" value="603" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #231E18; font: inherit; font-size: 16px">
        <span style="font-size: 13px; color: #706659">1</span>
      </div>
    </div>

    <div style="padding: 6px 24px 0; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0;">
        <span style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 999px; background: #F2EEE6; font-size: 14px; font-weight: 600">MS</span>
        <span style="flex: 1; display: flex; flex-direction: column">
          <span style="font-size: 17px; font-weight: 600">Mica Solano</span>
          <span style="font-size: 14px; color: #706659">+54 9 11 <strong style="font-weight: 600">603</strong>3-7725</span>
        </span>
      </div>
    </div>

    <div style="padding: 14px 24px 0; display: flex; gap: 10px">
      <span style="flex: 1; display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 999px; background: #F2EEE6; font-size: 15px; font-weight: 600; color: #706659">Sin cliente</span>
    </div>

    <div style="margin: 18px 24px 0; padding-top: 18px; border-top: 1px solid #EBE5DA; display: flex; flex-direction: column; gap: 14px">
      <span style="font-size: 17px; font-weight: 600">Nuevo cliente</span>

      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; color: #706659">Nombre</span>
        <input type="text" placeholder="Cómo lo tenés agendado" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 0; box-shadow: inset 0 0 0 2px #231E18; background: #FCFBF8; color: #231E18; font: inherit; font-size: 17px; font-weight: 600">
      </label>

      <div style="display: flex; gap: 10px">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 14px; color: #706659">Teléfono <span style="color: #706659">· opcional</span></span>
          <input type="tel" placeholder="11 2345-6789" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 0; background: #F2EEE6; color: #231E18; font: inherit; font-size: 16px">
        </div>
        <div style="width: 104px; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 14px; color: #706659">VIP</span>
          <div style="display: flex; align-items: center; justify-content: space-between; height: 46px; padding: 0 6px 0 14px; border-radius: 999px; background: #F2EEE6">
            <span style="font-size: 14px; color: #706659">No</span>
            <span style="width: 38px; height: 22px; border-radius: 999px; background: #EBE5DA; display: flex; align-items: center; padding: 3px; box-sizing: border-box">
              <span style="width: 16px; height: 16px; border-radius: 999px; background: #FCFBF8"></span>
            </span>
          </div>
        </div>
      </div>
    </div>

    <div style="margin-top: auto; padding: 16px 24px 22px"><a href="NuevaVenta.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 9px; height: 56px; border-radius: 999px; background: #231E18; color: #FCFBF8; text-decoration: none; font-size: 17px; font-weight: 600">Guardá y usá</a></div>
  </div>

</div>
</x-dc>
</body>
</html>
