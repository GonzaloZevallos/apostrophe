      <div style="display: flex; gap: 8px"><button aria-label="Agregar cliente" style="width: 36px; height: 36px; border-radius: 18px; border: 1px solid #DCE3DE; background: #FFFFFF; color: #15201A; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><button aria-label="Ajustes y cuenta" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 18px; border: none; background: #1E6B47; color: #FFFFFF; font: 600 13px 'Geist', sans-serif">ZE</button></div>
    </div>
    <label style="height: 44px; border-radius: 12px; background: #FFFFFF; border: 1px solid #DCE3DE; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #56645C; font-size: 15px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Buscar cliente o teléfono</span></label>
    <div role="tablist" aria-label="Vista" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #E6ECE8; border-radius: 12px; padding: 3px">

    </div>
  </header>

  <section aria-label="Resumen de lo que hay por cobrar" style="margin: 4px 16px 0; background: #FFFFFF; border-radius: 16px; padding: 14px; box-shadow: 0 1px 2px rgba(21,32,26,.06); display: flex; flex-direction: column; gap: 10px">

      <span style="font-size: 13px; color: #56645C">Por cobrar en total</span>
      <span style="font-size: 26px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">$57.800</span>

    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); font-size: 12px; color: #56645C">
      <span><b style="color: #15201A">$12.800</b><br>esta semana</span>
      <span><b style="color: #15201A">$20.100</b><br>8 a 30 días</span>
      <span><b style="color: #C0352B">$24.900</b><br>más de 30 días</span>
    </div>
  </section>

  <div style="margin: 12px 16px 0; background: #FFFFFF; border-radius: 16px; box-shadow: 0 1px 2px rgba(21,32,26,.06); display: flex; flex-direction: column">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
      <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #E9EEEA">
        <span aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 18px; background: #E2F1E8; color: #1E6B47; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{ r.ini }}</span>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <span style="font-size: 14px; font-weight: 600">{{ r.name }}</span>
          <span style="font-size: 12px; color: {{ r.ageColor }}">{{ r.age }}</span>
        </div>
        <span style="font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums">{{ r.amount }}</span>
        <button aria-label="Recordarle por WhatsApp" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 18px; border: 1px solid #DCE3DE; background: #FFFFFF; color: #15201A; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 0 1-13.4 7.9L3 21l1.1-4.6A9 9 0 1 1 21 12z"/></svg></button>

22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.5c2 .6 3.2 2.4 3.6 5.5"/></svg>Clientes</a><a href="#" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #56645C; font-size: 11px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>Productos</a></nav>
