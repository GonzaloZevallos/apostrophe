name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.13"
      - run: uv venv --python 3.13
      - run: uv sync --locked --extra dev
      - run: uv run --no-project pytest -n 8
      - run: uv run --no-project pytest -n 4 -p no:cacheprovider tests/architecture tests/migrations tests/test_business_isolation.py tests/test_gated_routes.py tests/test_stack_affected.py tests/test_stack_ci.py tests/test_ci_changes.py tests/test_ci_verdict.py tests/test_ci_coverage.py
      - run: uv run --no-project ruff check .
      - run: uv run --no-project mypy app tests scripts
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --no-fund --no-audit
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run lint
      - run: npm --prefix web test
      - run: npm --prefix web run build
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.13"
      - run: uv venv --python 3.13
      - run: uv sync --locked --extra dev
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --no-fund --no-audit
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm --prefix web run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-test-results
          path: web/test-results/
          retention-days: 14
