name: Daily encrypted backup

# Daily, plus a manual trigger for the go-live gate and after any configuration
# change (deploy/README.md's drill cadence). No credential here can create, delete or
# overwrite a Turso database, or delete an R2 copy younger than 90 days (the plan's
# invariant) — the Turso token is read-only and the R2 token is write-only, scoped to
# one bucket.
on:
  schedule:
    - cron: "0 7 * * *" # 04:00 in Buenos Aires (UTC-3), outside business hours
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.13"
      - run: uv venv --python 3.13
      - run: uv sync --locked
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Compute this run's file name
        run: echo "BACKUP_FILE=backup-$(date -u +%Y%m%dT%H%M%SZ)-${{ github.run_id }}.db.age" >> "$GITHUB_ENV"
      - name: Copy every table from Turso into a local SQLite file
        env:
          APOSTROPHE_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          APOSTROPHE_DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_READONLY_TOKEN }}
        run: uv run --no-project python scripts/backup_copy.py backup.db
      - name: Encrypt the copy for the committed age recipient
        run: age -r "$(cat deploy/age-recipient.txt)" -o "$BACKUP_FILE" backup.db
      - name: Upload to R2 (object-write-only token; no delete)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp "$BACKUP_FILE" "s3://${{ secrets.R2_BUCKET }}/$BACKUP_FILE" \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}" --region auto
