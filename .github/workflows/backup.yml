name: Daily encrypted backup

# This repository is public, and anyone can download a public repository's run
# artifacts, so the encrypted daily copy is never kept as an artifact. The ciphertext
# is pushed over SSH to the private repository GonzaloZevallos/apostrophe-backups,
# one branch per copy, and branches older than 30 days are pruned (the newest copy
# never is). The deploy key that can write there is the `backup` environment's secret,
# limited to `master`. No credential here can create, delete or overwrite a Turso
# database: the Turso token is read-only.
#
# Daily, plus a manual trigger for the go-live gate and after any configuration
# change (deploy/README.md's drill cadence).
on:
  schedule:
    - cron: "0 7 * * *" # 04:00 in Buenos Aires (UTC-3), outside business hours
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == 'GonzaloZevallos/apostrophe'
    environment: backup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.13"
      - run: uv venv --python 3.13
      - run: uv sync --locked
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Compute this run's file name
        run: date -u +"BACKUP_FILE=backup-%Y%m%dT%H%M%SZ-${{ github.run_id }}.db.age" >> "$GITHUB_ENV"
      - name: Copy every table from Turso into a local SQLite file
        env:
          APOSTROPHE_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          APOSTROPHE_DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_READONLY_TOKEN }}
        run: uv run --no-project python scripts/backup_copy.py backup.db
      - name: Encrypt the copy for the committed age recipient
        run: age -R deploy/age-recipient.txt -o "$BACKUP_FILE" backup.db
      - name: Remove the plaintext copy
        run: rm backup.db
      - name: Refuse a copy over 90 MB (GitHub's 100 MB file limit)
        run: test "$(stat -c %s "$BACKUP_FILE")" -le 94371840
      - name: Write the deploy key
        env:
          BACKUP_DEPLOY_KEY: ${{ secrets.BACKUP_DEPLOY_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/backup_key"
          printenv BACKUP_DEPLOY_KEY >> "$RUNNER_TEMP/backup_key"
      - name: Push the copy to the private repository, on its own branch
        shell: bash
        env:
          GIT_SSH_COMMAND: ssh -i ${{ runner.temp }}/backup_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${{ github.workspace }}/deploy/github_known_hosts
        run: |
          git init -b main "$RUNNER_TEMP/copy"
          mv "$BACKUP_FILE" "$RUNNER_TEMP/copy/"
          git -C "$RUNNER_TEMP/copy" add -- "$BACKUP_FILE"
          git -C "$RUNNER_TEMP/copy" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "$BACKUP_FILE"
          git -C "$RUNNER_TEMP/copy" push git@github.com:GonzaloZevallos/apostrophe-backups.git "HEAD:refs/heads/$BACKUP_FILE"
      - name: Prune copies older than 30 days, never the newest
        shell: bash
        env:
          GIT_SSH_COMMAND: ssh -i ${{ runner.temp }}/backup_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${{ github.workspace }}/deploy/github_known_hosts
        run: |
          expired="$(git ls-remote --heads git@github.com:GonzaloZevallos/apostrophe-backups.git | uv run --no-project python scripts/newest_backup.py expired --now "$(date -u +%Y%m%dT%H%M%SZ)")"
          if [ -n "$expired" ]; then git push --atomic git@github.com:GonzaloZevallos/apostrophe-backups.git --delete $expired; fi
      - name: Remove the deploy key
        if: always()
        run: rm -f "$RUNNER_TEMP/backup_key"
