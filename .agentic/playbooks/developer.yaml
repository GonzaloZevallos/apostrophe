- id: developer-2
  lesson: Never edit an enforcement checker or its allowlist outside your declared seams to turn a check green. Change your own code so the check passes unchanged, or record the limit under Decisions and leave the checker alone.
  category: standard-seams
  since: a0ede625
  seen_in:
  - GH-45
