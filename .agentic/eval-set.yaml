  # merged: true, returns: 0, cost_usd: 17.2799, cycle_time_hours: 2.5, wall_hours: 4.2 (closed_at 2026-10-26T03:02:21.333+00:00).
  - issue: 364
    base: fbc4fdc032b9ad43bd152beba87e69508d664125
    title: Copiar copies the catalog so it pastes into Telegram with its line breaks
    body: |-
      #### Feature (owner, 2026-10-25)

      **This is a change to the catalog's definition, and the owner asks for it.** Today `docs/product/catalog.md` says **Copiar** copies the raw catalog text with its `**` markers, and the app does exactly that. The owner wants that definition changed: what **Copiar** puts on the clipboard must paste right into Telegram, one of the owner's main channels, without breaking WhatsApp or plain text.

      #### Why (evidence from the owner's iPhone)

      **How it happens.** The owner taps **Copiar** in the app (over the HTTPS tunnel, so `navigator.clipboard.writeText`), then pastes into a Telegram chat's message box on iPhone. The owner's screenshot of the box after the paste shows:

      - The variety name shows **bold**, with no asterisks: `👑 **Sir Jack**` in `catalog.text` became bold "Sir Jack".
      - Every **single** line break became a space. The block reads as one run: `👑 Sir Jack • 30% indica / 70% sativa • Aroma/flavor: incienso, madera y limón • Price per gram: $14.000 • From 10 g: $13.000 each`.
      - Every **blank line**, between blocks and before the footer, became a single line break.

      That is exactly Markdown paragraph semantics. Telegram iOS parses Markdown in pasted plain text: `**…**` turns into a bold entity, and a lone `\n` is a soft break, so it collapses to a space. The trigger is the `**` that `app/catalog/domain/text.py` `_name_line` puts around each name. Confirm this by reproducing the parse, and rule out other causes with a text that has no `**`.

      **Other targets.** The owner sees the problem only in Telegram. WhatsApp and the rest paste fine.

      #### What done looks like

      1. Copied with **Copiar** and pasted into Telegram's message box on iPhone, the catalog keeps every line break the screen shows, one line per bullet, with blocks separated as on screen.
      2. It still reads right in WhatsApp and in a plain-text target. Don't fix Telegram by breaking the others.
      3. **Bold names are preferred but not required.** If they can survive in Telegram without breaking (2), keep them, for example with a rich clipboard entry (`text/html` with `<b>` and `<br>`) next to `text/plain`. If not, drop the `**` from what is copied. PM decides and updates `docs/product/catalog.md` with the new definition of what **Copiar** copies.
      4. A test pins the copied payload's shape, meaning the MIME types and the line breaks. The change must come with a statement of why the result survives Telegram's paste parsing.
      5. The catalog's content, the server's `catalog.text` for other uses, and the pinned catalog the bot sends stay as they are, unless PM decides the same change naturally belongs there too.
  # GH-385 (domain / backend change, type: platform_enhancement): PR #474, merge 7578f51cbd8b9c628b5f268122503a6d48ff2fb7, clean.
  # source: .agentic/tasks/GH-385.md, sha256 bd5835b55957d427ff03512ca7d49b0140cc4dd78e5232ac015836e073cfddf8 (at reading time).
  # base = <merge>^1; merge-base with master equals it, no merge of master in the branch.
  # merged: true, returns: 0, cost_usd: 16.6138, cycle_time_hours: 1.0, wall_hours: 1.7 (closed_at 2026-10-28T10:20:04.094+00:00).
  - issue: 385
    base: 76cd62659fc10995334f1ab5bdc256c008169623
    title: Rename Grams to Quantity in Python (wire unchanged)
    body: |-
      Blocked by: #384

      Mechanical rename with no behaviour change.
      - app/shared/grams.py becomes app/shared/quantity.py: Grams becomes Quantity, and InvalidGrams becomes InvalidQuantity with code quantity.invalid. The at-most-two-decimals check stays as the storage limit.
      - Rename domain, application and adapter names across stock, sales, results, varieties, catalog and spreadsheet_import.
      - JSON field names and database columns are unchanged: the adapter schemas map grams to quantity.
      - Every existing test passes, changed only in imports and names.

      #### Invariants

      1. A migration never changes the value of a column that existed before it; it only adds tables, columns and rows or fills new columns, and the shared M3 comparator in tests/migrations/ proves it.
      2. Every new table carries a non-null business_id, is read only through a repository built for one business, and a record of another business answers 404; every new route joins the isolation sweep and the gated-routes test.
      3. A column referencing variety.id is named variety_id (or ends in _variety_id); its domain attribute, port parameter and API field say product_id/Product, mapped only in the adapter.
      4. No code asks for today or a business day through BUSINESS_TIMEZONE, a literal zone name or datetime.now; it goes through get_today in accounts/adapters/deps.py or business_day(instant, zone) in app/shared/calendar.py.
      5. A stored quantity is a whole number of hundredths whatever the unit; the unit's decimals only validate input and decide display.
      6. A figure that sums quantities across products groups them by unit (QuantityByUnit); two quantities of different units are never added.
      7. Money on the wire is the value in currency units, parsed as Decimal through the one money schema type, never float; no request carries decimals or a scale.
      8. A use case never reads the stored money scale; the scale is applied only inside an adapter's SQL statement, through the one money adapter helper.
      9. An amount is held only in a typed integer column declared through money_column(); never in a JSON, Text or String column.
      10. Half-up rounding of an amount goes through round_half_up in app/shared/money.py; no literal // 100, round( or whole-peso assumption elsewhere.
      11. A migration's down_revision is the previous revision of the one linear chain, and its number is the one reserved in its brief.
      12. No new screen text sits outside the copy module, and no flower word (variety, gram, g, indica, sativa, aroma, strain, 🌿) appears in a new default.

      Part 2 of 37 of GH-318. The plan and its interview are in `.agentic/tasks/GH-318.md`; the original task branch `agentic/GH-318` is context for reading, nothing to bring in.

