  # GH-424 (copy / i18n change, type: platform_enhancement): PR #449, merge 4f6327b8068faad5e6932909b82edf17c73375d5, clean.
  # source: .agentic/tasks/GH-424.md, sha256 f3a152eb756466d35d75bd1c5cc40a8e506164300349cbd663db5af626e2b52c (at reading time).
  # base = <merge>^1; merge-base with master equals it, no merge of master in the branch.
  # merged: true, returns: 1, cost_usd: 21.5101, cycle_time_hours: 1.0, wall_hours: 1.3 (closed_at 2026-10-27T10:35:53.568+00:00).
  - issue: 424
    base: ae408a8bff1753d13b0305f34c8711e4e1141b91
    title: 'Front i18n: refusals onto keys with a flat code map, checked in every locale'
    body: |-
      Blocked by: #422

      This part uses the resolver from the seam part to move refusal texts onto i18next keys. English refusals read exactly as today, and the front never renders a response's `detail`.

      **1. `web/src/copy/locales/en/refusals.json`**
      - Flat, named keys: `generic`, `goneNotice`, `goneDetail`, `nameArchived`, `hasHistory`, `pinnedNotReady`, the `probarlo*` and `lookup*` texts, `languageNotSelectable`, `vipPriceNotBelowList`, `pinReason.<reason>`, the withdrawal messages, and so on.
      - Values stay byte-equal to today's.
      - Every entry is mapped in `baselineKeys/refusals.json`.
      - Generate `en-XA`, then run `i18n:types`.

      **2. `web/src/copy/refusalKeys.json`**
      - Hand-edited and flat: `{"<code>": "refusals:<key>"}`, one entry per `contract.json` code, mirroring today's `REFUSAL_BY_CODE`.
      - Gone codes map to `refusals:goneNotice`.
      - No code is an i18next path.

      **3. `web/src/api/refusals.ts`**
      - `REFUSAL_KEY: Record<RefusalCode, RefusalKey>` is built from the JSON through an `isKeyOf` type guard in `i18n/`, with no cast.
      - `GONE_NOTICE`, `PINNED_CATALOG_REASON_LABEL`, `PINNED_CATALOG_REFUSAL_OVERRIDES`, `WITHDRAWAL_REFUSAL_MESSAGES` and `VARIETY_REFUSAL_TEXT` hold keys.
      - `kindOf` and `resolveOverride` are unchanged.
      - Delete `copy/refusals.ts`; its `LONG_REFUSALS` become keys.

      **4. Readers resolve keys at render**
      - Refusal display, `PinnedCatalogBot`, the withdrawal and variety forms, and the gone screens.
      - `feedback.ts` compares the gone `notice` as the key.
      - The PR lists the hand edits.

      **5. Vitest**
      - The key set of `refusalKeys.json` equals the code set of `contract.json`.
      - Every value resolves to a string in `en`.

      **6. `tests/test_refusal_codes.py`**
      - Stop parsing `refusals.ts`.
      - Read `contract.json`, `refusalKeys.json` and every `web/src/copy/locales/<tag>/refusals.json`, `en-XA` included.
      - Assert that the code sets are equal, and that each value walks to a `str` in every locale.
      - Rewrite the negative self-tests on fixture JSON: a missing code, an extra code, a missing leaf and an object leaf.
      - Keep the English and no-input checks, reading `en/refusals.json`.
      - `mypy --strict` and `ruff` stay clean.

      **Done when:** every refusal reads through a key, English is unchanged, and the gate is green.

      #### Invariants

      1. No module under web/src/ outside web/src/i18n/ imports the i18next instance (main.tsx's side-effect import excepted); a helper takes `t` from its caller or returns a key, and nothing calls t() at module top level.
      2. Every moved English text renders equal to its en.baseline.json entry through its baselineKeys/<ns>.json mapping; baseline_exceptions.json stays [].
      3. Only the components part writes common.json; the refusals part writes refusals.json and refusalKeys.json; the empty-states part writes emptyStates.json; en-XA files come only from the pseudo script and resources.generated.d.ts only from `npm run i18n:types`.
      4. A file that reads COMMON_TEXT is listed in exactly one commonTextReaders/<area>.json, chosen by the area owning its directory.
      5. No front code renders a response's `detail`; no refusal code is used as an i18next path.
      6. copyProblems never reads en-XA and fails on a key missing in en.
      7. Formats, routes, API field names, error codes and database names do not change; mobile-check offender lists do not grow.

      Part 3 of 5 of GH-378. The plan and its interview are in `.agentic/tasks/GH-378.md`; the original task branch `agentic/GH-378` is context for reading, nothing to bring in.

