# What this product is built and checked with, and what it is called (agentic-system,
# ADR-0016 and ADR-0011, third addendum). `setup` prepares every checkout the system
# creates; `checks` run when a Developer delivers and when a reviewer reproduces an
# objection. Commands run from the checkout root, the same ones the README documents.
#
# `setup` gives each worktree its own environment: without it `uv run --no-project`
# climbs to the root `.venv` and a subtask would test another branch's code.
product: apostrophe
setup:
  venv: uv venv --python 3.13
  deps: uv sync --locked --extra dev
checks:
  tests: uv run --no-project pytest
  lint: uv run --no-project ruff check .
  types: uv run --no-project mypy app tests
# What a Developer's Edit/Write may never add (CODING_STANDARDS.md, section 6).
forbidden:
  - pattern: '#\s*(type:\s*ignore|noqa)\b'
    extensions: [.py, .pyi]
    reason: >-
      this silences mypy or ruff. CODING_STANDARDS.md section 6: fix the code instead;
      nothing is silenced in this product.
  - pattern: 'ignore_errors\s*=\s*true'
    extensions: [.toml]
    reason: >-
      this switches mypy off for a module. CODING_STANDARDS.md section 6: every module
      stays under strict mypy.
