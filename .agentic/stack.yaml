# What this product is built and checked with, and what it is called (agentic-system,
# ADR-0016 and ADR-0011, third addendum). `setup` prepares every checkout the system
# creates; `checks` run when a Developer delivers and when a reviewer reproduces an
# objection. Commands run from the checkout root, the same ones the README documents.
#
# `setup` gives each worktree its own environment: without it `uv run --no-project`
# climbs to the root `.venv` and a subtask would test another branch's code.
product: apostrophe
setup:
  venv: uv venv --python 3.13
  deps: uv sync --locked --extra dev
  web: npm --prefix web ci --no-fund --no-audit
  web-browsers: npx --prefix web playwright install chromium
checks:
  tests: uv run --no-project pytest -n auto
  lint: uv run --no-project ruff check .
  types: uv run --no-project mypy app tests
  web-types: npm --prefix web run typecheck
  web-lint: npm --prefix web run lint
  web-tests: npm --prefix web test
  web-e2e: npm --prefix web run e2e
# The product's design (agentic-system ADR-0040): the static prototype the design roles walk,
# the screen a walk starts from, and the two commands they may run instead of a browser.
# `sample_app` serves this checkout's front on a throwaway database seeded through the API;
# `compare` does that, writes each design screen next to the built one, and stops it.
design:
  prototype: docs/product/design-system/pantallas
  entry: Inicio.dc.html
  sample_app: scripts/design/sample-app.sh
  compare: scripts/design/compare.sh
# What a Developer's Edit/Write may never add (CODING_STANDARDS.md, section 6).
forbidden:
  - pattern: '#\s*(type:\s*ignore|noqa)\b'
    extensions: [.py, .pyi]
    reason: >-
      this silences mypy or ruff. CODING_STANDARDS.md section 6: fix the code instead;
      nothing is silenced in this product.
  - pattern: 'ignore_errors\s*=\s*true'
    extensions: [.toml]
    reason: >-
      this switches mypy off for a module. CODING_STANDARDS.md section 6: every module
      stays under strict mypy.
  - pattern: '@ts-(ignore|expect-error|nocheck)\b|(oxlint|eslint)-disable'
    extensions: [.ts, .tsx]
    reason: >-
      this silences TypeScript or the linter. CODING_STANDARDS.md section 6: fix the
      code instead; nothing is silenced in this product, front included.
