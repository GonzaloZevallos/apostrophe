# What this product is built and checked with, and what it is called (agentic-system,
# ADR-0016 and ADR-0011, third addendum). `setup` prepares every checkout the system
# creates; `checks` run when a Developer delivers and when a reviewer reproduces an
# objection. Commands run from the checkout root, the same ones the README documents.
#
# `setup` gives each worktree its own environment: without it `uv run --no-project`
# climbs to the root `.venv` and a subtask would test another branch's code.
product: apostrophe
setup:
  venv: uv venv --python 3.13
  deps: uv sync --locked --extra dev
  web: npm --prefix web ci --no-fund --no-audit
  web-browsers: npx --prefix web playwright install chromium
checks:
  tests: uv run --no-project pytest -n 8
  tests-fast: uv run --no-project pytest -n 4 -p no:cacheprovider tests/architecture tests/migrations tests/test_business_isolation.py tests/test_gated_routes.py tests/test_stack_affected.py tests/test_stack_ci.py
  lint: uv run --no-project ruff check .
  types: uv run --no-project mypy app tests scripts
  web-types: npm --prefix web run typecheck
  web-lint: npm --prefix web run lint
  web-tests: npm --prefix web test
  web-build: npm --prefix web run build
  # web-e2e is back (GH-476, after #428): it is a check of the full tier and of CI's `e2e` job,
  # and it gates the merge through `ci-ok`. It is not in `delivery_checks`.
  web-e2e: npm --prefix web run e2e
# `parallel_checks`: the gate runs the checks above at once (agentic-system ADR-0044),
# so a gate takes the slowest check instead of the sum (passing-gate median 16.1 min, 2026-10-12
# to 26). Shared-state inventory, 2026-10-26, 16 cores, each check run alone: every cache has one
# writer (.ruff_cache lint, .mypy_cache types, web/node_modules/.tmp web-types,
# web/node_modules/.vite web-tests, .pytest_cache tests; web-lint writes nothing), .venv and
# uv.lock are only read, only `tests` binds ports (from the code; other worktrees' servers hid
# them in `ss`), and the tests that need `web/dist` use a tmp_path. No shared state found. The
# 5-serial/5-parallel medians were not taken: the load average was 33-148 from other worktrees the
# whole time, far over the 2.0 cut-off. Parallel runs (checks in parallel, load 35-60): `tests`
# took 650 s under `-n auto`, over the 600 s check timeout, so it is capped at `-n 8`: 501 s, the
# whole gate 501 s, counts equal to alone (pytest 3480 passed; vitest 208 files, 2952 tests).
# Three load-only reds were found and fixed in the tests' own timing (two in
# tests/test_e2e_clock.py, one budget in tests/results/test_period_figures.py); then 30 stress
# iterations of the load-sensitive tests, with the other checks looping at load 57-148, were green.
# Read at a task's base, like every key here.
parallel_checks: true
# `delivery_checks` (agentic-system ADR-0064): the fast tier every subtask delivery and
# re-delivery runs, with the affected forms below where declared. The full tier is all of
# `checks`: it runs once per task in `full_checks` on the integrated head, and the merge gate
# runs it too. Measured 2026-10-26, 16 cores, each check alone then in parallel as the gate runs
# them (table in .agentic/tasks/GH-442.md; the machine was never idle, load 17-72, so every
# figure is an upper bound). Declaring every check (A) took 345.3 s at best (load 26.86 -> 34.89),
# median 424.6 s: over the ~300 s goal, and `tests` was the slowest check (345.3 s), not
# `web-tests` (241.4 s with its full rerun). Dropping `web-tests` (B) did not help: 403.6 s at
# best (load 56.78 -> 72.30). So `tests` is replaced by `tests-fast`, the pytest subset that
# guards the cheap whole-codebase rules (architecture, migrations, business isolation, gated
# routes, and the two stack pins): 94.8 s alone with -n 4 (load 34.14 -> 31.72) against 110.5 s
# with -n 2 (load 21.23 -> 16.62), so -n 4. The gate with it (C) took 229.3 s at best (load
# 18.71 -> 46.32), median 290.2 s, worst 312.2 s (load 47.52 -> 53.11), with the `web-tests`
# rerun included. What moved to the full tier: the rest of pytest (`tests` alone: 187.7 s,
# load 29.82 -> 22.02). Its cost: a failure outside those paths is found at `full_checks`, after
# the subtasks are integrated, not at the Developer's delivery. `web-tests` stays in: on a
# web diff its affected form took 83.9-90.4 s (loads 41.00 -> 38.37 and 53.46 -> 47.99), and
# an app-only diff selects nothing, so it reruns in full (180.3 s alone, load 40.89 -> 41.12).
# `web-e2e` is not here: it runs in the full tier and in CI (GH-476). `web-build` leaves the
# fast tier too (GH-476); it still runs in CI's `web` job and in the full tier. The shared-state inventory above still holds:
# `tests-fast` carries `-p no:cacheprovider`, so `.pytest_cache` keeps one writer (`tests`).
# Read at a task's base, like every key here.
delivery_checks:
  - tests-fast
  - lint
  - types
  - web-types
  - web-lint
  - web-tests
# Affected-only forms (agentic-system ADR-0046, ours ADR-0039): the Developer's and the
# reviewer's gates run these with `{base}` replaced by the task base sha, and rerun the
# check in full when one fails. The merge gate and CI always run the full commands above.
# Each form exits non-zero when it selects nothing. `tests` (pytest) has none, on purpose.
affected_checks:
  web-tests: uv run --no-project python scripts/affected.py vitest {base}
  web-e2e: uv run --no-project python scripts/affected.py e2e {base}
# Paths whose change can affect anything, so a gate runs everything. Here `*` crosses `/`.
affected_fallback:
  - .github/workflows/*
  - uv.lock
  - pyproject.toml
  - web/package.json
  - web/package-lock.json
  - web/vite.config.ts
  - web/playwright.config.ts
  - web/tsconfig*.json
  - web/src/test-setup.ts
  - web/e2e/env.ts
  - web/e2e/freePort.ts
  - web/e2e/fixtures.ts
  - web/e2e/backend.ts
  - web/scripts/e2e.sh
  - tests/e2e_app.py
  - app/legacy_front_paths.json
  - app/migrations/*
  - tests/conftest.py
  - tests/fixtures/*
  - tests/fakes/*
  - scripts/affected.py
  - scripts/ci_areas.py
  - scripts/ci_changes.py
  - scripts/ci_vitest.py
  - scripts/e2e_screen_specs.json
  - scripts/__init__.py
# The product's design (agentic-system ADR-0040): the static prototype the design roles walk,
# the screen a walk starts from, and the two commands they may run instead of a browser.
# `sample_app` serves this checkout's front on a throwaway database seeded through the API;
# `compare` does that, writes each design screen next to the built one, and stops it.
design:
  prototype: docs/product/design-system/pantallas
  entry: Inicio.dc.html
  sample_app: scripts/design/sample-app.sh
  compare: scripts/design/compare.sh
# What a Developer's Edit/Write may never add (CODING_STANDARDS.md, section 6).
forbidden:
  - pattern: '#\s*(type:\s*ignore|noqa)\b'
    extensions: [.py, .pyi]
    reason: >-
      this silences mypy or ruff. CODING_STANDARDS.md section 6: fix the code instead;
      nothing is silenced in this product.
  - pattern: 'ignore_errors\s*=\s*true'
    extensions: [.toml]
    reason: >-
      this switches mypy off for a module. CODING_STANDARDS.md section 6: every module
      stays under strict mypy.
  - pattern: '@ts-(ignore|expect-error|nocheck)\b|(oxlint|eslint)-disable'
    extensions: [.ts, .tsx]
    reason: >-
      this silences TypeScript or the linter. CODING_STANDARDS.md section 6: fix the
      code instead; nothing is silenced in this product, front included.
# `ci`: the check-run name of ci.yml that gates a merge (agentic-system ADR-0045, GH-216
# amendment): with it, `agentic merge` decides from GitHub's CI on the reviewed head instead of
# rerunning every check locally. Only `ci-ok` is named: it `needs` every other job (changes,
# checks, web, docs, pytest, vitest, e2e, coverage) and reads the `changes` flags, so a suite
# skipped as unaffected counts as passed and a suite that failed or was skipped without a "false"
# flag does not. Every check below runs in a job `ci-ok` needs, in full or in shards
# (tests/test_stack_ci.py, CI_FORMS; ADR-0054, ADR-0067). `docs` runs no declared check: the
# generator's stale check, the Mermaid render, the offline link check and the OpenAPI
# breaking-change check (ADR-0066). e2e gates again (#428 fixed the flake).
ci: [ci-ok]
